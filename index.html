<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Spartan Quiz</title>
<style>:root{--bg:#070b13;--card:#101827;--line:#2a3850;--text:#f8fafc;--muted:#94a3b8;--gold:#f59e0b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#263653,#070b13 55%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh}header{position:sticky;top:0;z-index:20;text-align:center;padding:17px;background:#070a10ee;border-bottom:1px solid #1f2937;backdrop-filter:blur(10px)}.logo{font-weight:1000;letter-spacing:2px}.sub{font-size:11px;color:var(--muted);margin-top:3px}main{width:min(720px,92vw);margin:22px auto 60px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:21px;box-shadow:0 18px 55px #0006}h1{margin:0 0 8px;font-size:27px}h2{font-size:20px;line-height:1.45;margin:12px 0 18px}.muted{color:var(--muted)}input[type=text],input[type=password]{width:100%;padding:14px;background:#09111f;color:#fff;border:1px solid #334155;border-radius:11px}button{border:0;border-radius:12px;padding:14px 17px;font-weight:900;cursor:pointer}.primary{background:var(--gold);color:#16100a;width:100%}.secondary{background:#1e293b;color:white;width:100%}.timer{position:sticky;top:67px;z-index:15;text-align:center;background:#211907;border:1px solid #715616;color:#fbbf24;border-radius:12px;padding:9px;font-size:24px;font-weight:1000;margin-bottom:12px}.progress{height:6px;background:#1e293b;border-radius:99px;overflow:hidden;margin-bottom:16px}.bar{height:100%;background:var(--gold);width:0}.qnum{font-size:12px;letter-spacing:1px;color:#fbbf24;font-weight:900}.option{display:flex;gap:11px;align-items:flex-start;padding:14px;border:1px solid #334155;border-radius:12px;margin:9px 0;background:#09111f;cursor:pointer}.option input{margin-top:3px}.notice{font-size:13px;padding:11px;border-radius:10px;background:#172033;color:#cbd5e1;margin:13px 0}.err{background:#3b1218;color:#fecaca}.score{text-align:center;font-size:64px;color:#fbbf24;font-weight:1000}.nav{display:flex;gap:10px;margin-top:16px}.nav button{flex:1}.adminrow{border:1px solid #334155;border-radius:12px;padding:12px;margin:10px 0;background:#0a1220}.tiny{font-size:12px;color:var(--muted)}.correct{color:#86efac}.wrong{color:#fca5a5}.empty{color:#cbd5e1}.status{margin-top:8px;font-weight:800}</style></head>
<body><header><div class="logo">THE SPARTAN</div><div class="sub">QUIZ ARENA • QUIZ 1</div></header><main id="app"></main>
<script>
const app=document.getElementById('app');let quiz,attemptId,expiresAt,questionIndex=0,timerId=null,submitted=false,active=false,leaving=false;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function home(){app.innerHTML=`<div class="card"><h1>Quiz 1 — The Spartan</h1><p class="muted">7 soal • waktu 8 menit</p><div class="notice">Masukkan nama dan token dari admin. Soal ditampilkan satu per satu.</div><label>Nama peserta</label><br><input id="name" type="text" maxlength="60" placeholder="Nama / username"><br><br><label>Token</label><br><input id="token" type="text" placeholder="Token quiz"><br><br><button class="primary" onclick="start()">MULAI QUIZ</button><p id="msg"></p><p style="text-align:center"><button style="background:none;color:#94a3b8;font-size:12px" onclick="admin()">Admin</button></p></div>`}
async function start(){const name=document.getElementById('name').value.trim(),token=document.getElementById('token').value.trim(),msg=document.getElementById('msg');try{const r=await fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,token})}),d=await r.json();if(!r.ok)throw Error(d.error);quiz=await fetch('/api/quiz').then(r=>r.json());attemptId=d.attemptId;expiresAt=d.expiresAt;questionIndex=0;submitted=false;active=true;leaving=false;sessionStorage.setItem('spartanAttempt',attemptId);sessionStorage.setItem('spartanAnswers','{}');sessionStorage.removeItem('spartanToken');addLeaveGuards();renderQuestion();timerId=setInterval(tick,250);tick()}catch(e){msg.textContent=e.message;msg.className='notice err'}}
function addLeaveGuards(){document.addEventListener('visibilitychange',onVisibility);window.addEventListener('pagehide',onPageHide)}function removeLeaveGuards(){document.removeEventListener('visibilitychange',onVisibility);window.removeEventListener('pagehide',onPageHide)}
function renderQuestion(){const q=quiz.questions[questionIndex];app.innerHTML=`<div class="timer" id="timer">08:00</div><div class="progress"><div class="bar" id="bar"></div></div><section class="card"><div class="qnum">SOAL ${questionIndex+1} DARI 7</div><h2>${esc(q.text)}</h2>${q.options.map((o,j)=>`<label class="option"><input type="${q.multi?'checkbox':'radio'}" name="answer" value="${String.fromCharCode(65+j)}"><span><b>${String.fromCharCode(65+j)}.</b> ${esc(o)}</span></label>`).join('')}<div class="nav">${questionIndex>0?'<button class="secondary" onclick="prev()">KEMBALI</button>':''}<button class="primary" onclick="next()">${questionIndex===6?'SELESAI':'LANJUT'}</button></div></section><div class="notice">Jika kamu meninggalkan halaman atau berpindah aplikasi, pengerjaan akan dicoba dikumpulkan otomatis.</div>`;restoreAnswer();tick()}
function saveAnswer(){if(!quiz)return;const vals=[...document.querySelectorAll('input[name="answer"]:checked')].map(x=>x.value);const all=JSON.parse(sessionStorage.getItem('spartanAnswers')||'{}');all[quiz.questions[questionIndex].id]=vals;sessionStorage.setItem('spartanAnswers',JSON.stringify(all))}
function restoreAnswer(){const all=JSON.parse(sessionStorage.getItem('spartanAnswers')||'{}'),vals=all[quiz.questions[questionIndex].id]||[];document.querySelectorAll('input[name="answer"]').forEach(x=>x.checked=vals.includes(x.value))}
function next(){saveAnswer();if(questionIndex<quiz.questions.length-1){questionIndex++;renderQuestion()}else submitQuiz('manual')}
function prev(){saveAnswer();if(questionIndex>0){questionIndex--;renderQuestion()}}
function tick(){if(!active)return;const left=Math.max(0,expiresAt-Date.now()),s=Math.ceil(left/1000),t=document.getElementById('timer'),b=document.getElementById('bar');if(t)t.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(b)b.style.width=(100-left/480000*100)+'%';if(left<=0&&!submitted)submitQuiz('time_expired')}
async function submitQuiz(reason){if(submitted||!attemptId)return;submitted=true;active=false;clearInterval(timerId);removeLeaveGuards();try{saveAnswer();const answers=JSON.parse(sessionStorage.getItem('spartanAnswers')||'{}');const body=JSON.stringify({attemptId,answers,reason});const r=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body,keepalive:reason!=='manual'});const d=await r.json();if(!r.ok)throw Error(d.error);sessionStorage.removeItem('spartanAnswers');sessionStorage.removeItem('spartanAttempt');app.innerHTML=`<div class="card" style="text-align:center"><div class="qnum">HASIL QUIZ</div><h1>${reason==='time_expired'?'WAKTU HABIS':'PENGERJAAN SELESAI'}</h1><div class="score">${d.score}/7</div><p class="muted">Jawaban telah tersimpan.</p></div>`}catch(e){submitted=false;active=true;if(reason==='manual')alert(e.message);}}
function onVisibility(){if(document.hidden&&active&&!submitted&&!leaving){leaving=true;submitQuiz('left_page')}}function onPageHide(){if(active&&!submitted&&!leaving){leaving=true;submitQuiz('left_page')}}
async function admin(){const u=prompt('Username admin:'),p=prompt('Password admin:');if(u===null||p===null)return;const h='Basic '+btoa(u+':'+p);const r=await fetch('/api/admin',{headers:{Authorization:h}});if(!r.ok){alert('Login admin salah atau database belum tersambung.');return}const rows=await r.json();app.innerHTML=`<div class="card"><h1>Admin — Hasil Peserta</h1><p class="muted">${rows.length} pengerjaan</p>${rows.length?rows.map(renderAdmin).join(''):'<div class="notice">Belum ada peserta.</div>'}<br><button class="secondary" onclick="home()">KEMBALI</button></div>`}
function renderAdmin(a){return `<div class="adminrow"><b>${esc(a.name)}</b> — <b>${a.score??'-'}/7</b><div class="tiny">${esc(a.reason||'manual')} • ${a.submitted_at?new Date(Number(a.submitted_at)).toLocaleString('id-ID'):'belum selesai'}</div>${[1,2,3,4,5,6,7].map(i=>{const d=a.details[i],got=d.answer.length?d.answer.join(', '):'— tidak dijawab';return `<div class="${d.status==='correct'?'correct':d.status==='wrong'?'wrong':'empty'}">Soal ${i}: ${esc(got)} • ${d.status==='correct'?'BENAR':d.status==='wrong'?'SALAH':'TIDAK DIJAWAB'}</div>`}).join('')}</div>`}
home();
</script></body></html>
